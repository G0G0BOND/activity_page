    .NoTab-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0);
      z-index: 999998;
      pointer-events: none;
      transition: background-color 0.2s ease;
    }

    .NoTab-overlay-visible {
      background-color: rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .NoTab-link-tooltip {
      position: fixed;
      z-index: 999999;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      overflow: hidden;
      max-width: 90vw;
      max-height: 90vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .NoTab-link-tooltip-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .NoTab-link-tooltip-content {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
      border-radius: 12px; /* Apply border-radius here */
      background: #fff;
    }

    /* Updated Header Styles */
    .NoTab-link-tooltip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px 6px 12px;
      background: #f5f5f5;
      border-bottom: 1px solid #e0e0e0;
      cursor: move;
      user-select: none;
      height: 40px;
      gap: 8px; /* 增加元素间距 */
      flex-shrink: 0;
    }

    /* New Link Group Styles */
    .NoTab-link-tooltip-link-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1; /* 修改这里，让link group占据更多空间 */
      min-width: 0;
      border: 1px solid #ccc;
      border-radius: 16px;
      padding: 3px 5px 3px 3px;
      background-color: #fff;
      transition: border-color 0.2s;
    }
    .NoTab-link-tooltip-link-group:hover {
       border-color: #aaa;
    }


    /* Updated Title Styles */
    .NoTab-link-tooltip-link-group .NoTab-link-tooltip-title { /* Increased specificity */
      font-size: 13px;
      font-weight: normal;
      color: var(--tooltip-header-text); /* Use variable */
      white-space: nowrap;
      overflow: hidden;
      margin-left: 10px;
      text-overflow: ellipsis;
      text-decoration: none; /* Remove underline from link */
      cursor: pointer; /* Indicate it's clickable */
      flex: 1; /* Allow title to take space */
      min-width: 0; /* Prevent overflow */
      line-height: 1.4; /* Adjust line height */
    }
    .NoTab-link-tooltip-link-group .NoTab-link-tooltip-title:hover { /* Increased specificity */
       color: #007bff; /* Change color on hover */
    }
    .NoTab-link-tooltip-link-group .NoTab-link-tooltip-title:visited { /* Increased specificity */
      color: var(--tooltip-header-text); /* Prevent visited link color change */
    }

    /* Updated Actions Styles */
    .NoTab-link-tooltip-actions {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0; /* 防止被压缩 */

    /* General Action Button Styles */
    .NoTab-link-tooltip-action {
      background: none;
      border: none;
      /* font-size: 16px; /* Slightly smaller icons */ */ /* Removed font-size */
      color: #777; /* Default icon color */
      cursor: pointer;
      padding: 0; /* Remove default padding */
      line-height: 1;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px; /* Fixed width */
      height: 28px; /* Fixed height */
      border-radius: 6px; /* Rounded corners */
      position: relative;
      /* Add background properties for icons */
      background-color: #555; /* Darker default icon color */
      mask-repeat: no-repeat;
      mask-position: center center;
      mask-size: 16px 16px; /* Control icon size */
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center center;
      -webkit-mask-size: 16px 16px;
    }

    .NoTab-link-tooltip-action:hover {
      background-color: #111; /* Darker icon color on hover */
      color: #333; /* Darker icon color on hover */
    }

    .NoTab-link-tooltip-action.active {
      color: #1976d2; /* Use color for the icon */
      background-color: #007bff; /* Brighter blue for active pin */
    }

    .NoTab-link-tooltip-action.disabled {
      background-color: #aaa;
      cursor: not-allowed;

    /* Tooltip for Action Buttons */
    .NoTab-link-tooltip-action::after {
      content: attr(title);
      position: absolute;
      bottom: 110%; /* Position above the button */
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 11px; /* Smaller font size */
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s 0.1s, visibility 0.2s 0.1s; /* Added delay */
      pointer-events: none;
    }

    .NoTab-link-tooltip-action:hover::after {
      opacity: 1;
      visibility: visible;
      /* bottom: -25px; Adjusted position if needed */
    }


    .NoTab-link-tooltip-body {
      flex: 1; /* Allow body to take remaining space */
      display: flex;
      flex-direction: column;
      height: 100%; /* Ensure body fills available height */
      width: 100%;
      background: #fff;
      min-height: 0; /* Prevent body from overflowing */
    }

    .NoTab-limit-message {
      padding: 12px 16px;
      font-size: 18px;
    }

    .NoTab-link-tooltip-summary {

      line-height: 1.6;
      color: #333;
      border-bottom: 1px solid #e0e0e0;
      max-height: 150px;
      overflow-y: auto;
      background-color: #fafafa;
      flex-shrink: 0; /* Prevent summary from shrinking */
    }

    .NoTab-link-tooltip-iframe-container {
      flex: 1;
      position: relative;
      padding: 0 1px 1px 1px;
      min-height: 0;
      border-radius: 0 0 12px 12px;
    }
    
    .NoTab-link-tooltip-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .NoTab-link-tooltip-reader-container {
      flex: 1;

      padding: 0;
      background: #fff;
      min-height: 0;
      border-radius: 0 0 12px 12px;
      overflow-y: auto;
      display: none;
    }

    .NoTab-reader-content {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      line-height: 1.6;
      color: #333;
    }

    .NoTab-reader-content h1 {

    }

    .NoTab-reader-content .byline {
      font-style: italic;

    .NoTab-reader-content h2,

      line-height: 1.3;

    }

    .NoTab-reader-content h2 {
      font-size: 1.4em;
    }

    .NoTab-reader-content h3 {
      font-size: 1.2em;
    }

    .NoTab-reader-content p {
      margin-bottom: 1em;
    }

    .NoTab-reader-content img {

    .NoTab-reader-content blockquote {

    }

    .NoTab-reader-content pre {
      padding: 1em;
      overflow-x: auto;
    }

    @media (prefers-color-scheme: dark) {
      .NoTab-reader-content {
        color: #eee;
        background-color: #222;
      }
      
      .NoTab-reader-content a {
        color: #61afef;
      }
      
      .NoTab-reader-content blockquote {
        border-left-color: #444;
        color: #aaa;
      }
      
      .NoTab-reader-content code,

    .NoTab-link-tooltip-loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 0 0 12px 12px;
      backdrop-filter: blur(4px);
      z-index: 1; /* Ensure loading is above iframe */
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 8px;
    }

    .loading-spinner + p {
      font-size: 13px;
      color: #666;
      margin: 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .NoTab-link-tooltip-resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      /* background: linear-gradient(135deg, transparent 50%, rgba(0, 0, 0, 0.1) 50%, rgba(0, 0, 0, 0.1) 100%); */
      border-radius: 0 0 12px 0;
      transition: background 0.2s;
      z-index: 2; /* Ensure handle is above iframe */
      /* Use a border triangle for better visibility */
      border-bottom: 16px solid rgba(0, 0, 0, 0.1);
      border-left: 16px solid transparent;

    }

    .NoTab-link-tooltip-resize-handle:hover {
      /* background: linear-gradient(135deg, transparent 50%, rgba(0, 0, 0, 0.15) 50%, rgba(0, 0, 0, 0.15) 100%); */
      border-bottom-color: rgba(0, 0, 0, 0.2);
    }

    .NoTab-link-tooltip-progress {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: transparent;
      overflow: hidden;
      z-index: 1;
    }

    .NoTab-link-tooltip-progress.notab-loading::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #4a90e2, transparent);
      animation: progress 1.5s ease-in-out infinite;
    }

    @keyframes progress {
      0% {
        left: -50%;
      }
      100% {
        left: 100%;
      }
    }
